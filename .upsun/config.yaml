applications:
  app:
    type: composable:26.05
    stack:
      packages:
        - hugo  # Use Hugo from Nix packages for static site generation
        - curl  # Needed for the DNS API call
        - dig   # Needed to find the IP of the gateway
    hooks:
      build: |
        set -e
        hugo --destination=public --minify
      # Point the apex A record at the region gateway. Runs after every deploy
      # (unlike the build hook, which is skipped when Upsun reuses a cached
      # build) and only from production, so preview environments leave DNS
      # alone. Failures are logged but never fail the deploy.
      post_deploy: |
        set -u
        if [ "${PLATFORM_ENVIRONMENT_TYPE:-}" != production ]; then
          echo "Not production, skipping DNS update."
          exit 0
        fi
        gateway_ip="$(dig +short gw.eu-5.platformsh.site | head -n1)"
        if [ -z "${gateway_ip}" ]; then
          echo "Could not resolve the gateway IP, skipping DNS update."
          exit 0
        fi
        echo "Setting A record on deSEC to ${gateway_ip}..."
        curl -sSf -X PATCH https://desec.io/api/v1/domains/vipau.dev/rrsets/@/A/ \
          --header "Authorization: Token ${DESEC_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{\"records\": [\"${gateway_ip}\"]}" \
          || echo "deSEC update failed, leaving the existing record in place."
        echo
    web:
      commands:
        start: sleep infinity
      locations:
        # HTML is not fingerprinted, so it needs a short TTL.
        /:
          root: public
          index:
            - index.html
          expires: 1h
          scripts: false
          headers:
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Frame-Options: SAMEORIGIN
        # Hugo fingerprints these filenames, so they can be cached forever.
        /css:
          root: public/css
          expires: 1y
          scripts: false
        /js:
          root: public/js
          expires: 1y
          scripts: false
        /fonts:
          root: public/fonts
          expires: 1y
          scripts: false
        # Not fingerprinted, but they change rarely.
        /images:
          root: public/images
          expires: 7d
          scripts: false
        /files:
          root: public/files
          expires: 7d
          scripts: false

routes:
  https://{default}/:
    type: upstream
    upstream: app:http
  # Serve a single canonical hostname.
  https://www.{default}/:
    type: redirect
    to: https://{default}/
