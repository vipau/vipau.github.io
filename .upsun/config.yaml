applications:
  app:
    type: composable:25.11
    stack:
      packages:
        - hugo  # Use Hugo from Nix packages for static site generation
        - go    # Required for Hugo modules and theme dependencies
        - curl
    hooks:
      build: |
        set -ex
        hugo --destination=public
      post-deploy: |
        echo "Setting A record on Desec..."    
        echo "{\"records\": [\"$(curl -s https://ifconfig.me/ip)\"]}" | curl -X PATCH https://desec.io/api/v1/domains/vipau.dev/rrsets/@/A/ --header "Authorization: Token ${DESEC_TOKEN}" --header "Content-Type: application/json" --data @-

    web:
      commands:
        start: sleep infinity  # Static site, no server process needed
      locations:
        /:
          root: public
          index:
            - index.html
          expires: 1h
          scripts: false

routes:
  https://{default}/:
    type: upstream
    upstream: app:http
  https://www.{default}/:
    type: upstream
    upstream: app:http
